name: Customer Churn ML CI/CD

on:
  push:
    branches:
      - main

jobs:
  train_and_update_model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install jupyter nbconvert

      - name: Run training notebook
        run: |
          jupyter nbconvert --to notebook --execute cust1_train.ipynb --output result_train.ipynb

      - name: Commit and push new model
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add model.pkl
          git commit -m "Auto-update model from CI/CD" || echo "No changes to commit"
          git push
