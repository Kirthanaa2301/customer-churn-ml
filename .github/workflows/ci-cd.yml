name: CI/CD for Customer Churn ML Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost jupyter nbconvert seaborn matplotlib

      - name: Run training notebook
        run: |
          jupyter nbconvert --to notebook --execute cust1_train.ipynb --output result_train.ipynb

      - name: Run prediction notebook
        run: |
          jupyter nbconvert --to notebook --execute cust1_prediction.ipynb --output result_prediction.ipynb

      - name: Commit and push model + prediction CSV
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # Add model and prediction output files
          git add model.pkl || echo "No model file found"
          git add cust1_churn_predictions.csv || echo "No prediction file found"

          git commit -m "Auto-update model and predictions from CI/CD" || echo "No changes to commit"
          git push || echo "Nothing to push"

      - name: Upload Artifacts (optional for download)
        uses: actions/upload-artifact@v4
        with:
          name: churn-results
          path: |
            result_train.ipynb
            result_prediction.ipynb
            model.pkl
            cust1_churn_predictions.csv
